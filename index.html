<!doctype html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes — Home</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/app.css" />
  </head>

  <body>
    <div class="app">
      <aside class="sidebar">
        <!-- Riempi via JS in common.js -->
      </aside>

      <main class="main">
        <header
          class="topbar d-flex align-items-center justify-content-between px-4"
        >
          <div class="topbar-nav d-flex gap-2 me-2">
            <button id="back" class="nav-btn" aria-label="Indietro">‹</button>
            <button id="forward" class="nav-btn" aria-label="Avanti">›</button>
          </div>

          <div class="topbar-search">
            <input
              type="text"
              id="topbar-search"
              class="search-input"
              placeholder="Cerca..."
              autocomplete="off"
            />
          </div>
          <div><span class="material-symbols-outlined text-success avatar">account_circle </span></div>
        </header>

        <section class="home">
          <!--
            SEZIONI DA COSTRUIRE (vedi js/home.js):
            - "Riprodotti di recente" (da localStorage history)
            - "I tuoi preferiti" (da localStorage favourites)
            - "Suggerimenti pop"
            - "Suggerimenti rock"
            - "Suggerimenti italian pop"
            Ogni sezione è un <section class="row"> con titolo h2 e una griglia di .card.
          -->
        </section>
      </main>

      <footer class="player">
        <!-- Riempi via JS in common.js -->
      </footer>
    </div>

    <audio id="audio-element"></audio>

    <script src="./assets/js/common.js"></script>
    <script src="./assets/js/home.js"></script>
  </body>
</html>
