<!doctype html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes — Cerca</title>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/app.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar"></aside>

      <main class="main">
        <header
          class="topbar d-flex align-items-center justify-content-between px-4"
        >
          <div class="topbar-nav d-flex gap-2 me-2">
            <button id="back" class="nav-btn" aria-label="Indietro">‹</button>
            <button id="forward" class="nav-btn" aria-label="Avanti">›</button>
          </div>

          <div class="topbar-search">
            <input
              type="text"
              id="topbar-search"
              class="search-input"
              placeholder="Cerca..."
              autocomplete="off"
            />
          </div>
          <div><span class="material-symbols-outlined text-success avatar">account_circle</span></div>

          <!--<div class="user-pill rounded-pill fw-semibold">Studente Epicode</div>-->
        </header>

        <section class="search">
          <div class="search-box">
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Cerca un brano, un album, un artista..."
              autocomplete="off"
            />
          </div>

          <p id="error"></p>

          <div class="search-results">
            <section class="row" id="row-tracks" hidden>
              <h2>Brani</h2>
              <div class="grid" id="grid-tracks"></div>
            </section>
            <section class="row" id="row-albums" hidden>
              <h2>Album</h2>
              <div class="grid" id="grid-albums"></div>
            </section>
            <section class="row" id="row-artists" hidden>
              <h2>Artisti</h2>
              <div class="grid" id="grid-artists"></div>
            </section>
          </div>
        </section>
      </main>

      <footer class="player"></footer>
    </div>

    <audio id="audio-element"></audio>

    <script src="./assets/js/common.js"></script>
    <script src="./assets/js/search.js"></script>
  </body>
</html>
